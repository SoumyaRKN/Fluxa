[package]
name = "fluxa-backend"
version = "0.1.0"
edition = "2021"
description = "Fluxa – LAN file explorer and transfer system backend"

[[bin]]
name = "fluxa"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header", "limit"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
mdns-sd = "0.13"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
dashmap = "6"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
mime_guess = "2"
hostname = "0.4"
local-ip-address = "0.6"
http = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
