<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0f172a" stroke="url(#grad)" stroke-width="3"/>
  <!-- Wave / flow symbol -->
  <path d="M 40 100 Q 60 68 80 100 Q 100 132 120 100 Q 140 68 160 100" 
        stroke="url(#grad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Dots on the wave -->
  <circle cx="40" cy="100" r="5" fill="#06b6d4"/>
  <circle cx="100" cy="132" r="5" fill="#6366f1"/>
  <circle cx="160" cy="100" r="5" fill="#8b5cf6"/>
  <!-- Small transfer arrows -->
  <path d="M 72 70 L 80 62 L 88 70" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 112 130 L 120 138 L 128 130" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
